spring.application.name=eventpass-auth-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventpass_auth}
spring.datasource.username=${DB_USER:eventpass}
spring.datasource.password=${DB_PASSWORD:eventpass_local_only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
