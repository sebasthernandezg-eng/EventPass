server:
  port: 8080
spring:
  application:
    name: eventpass-gateway
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://auth-service:8081
          predicates: [Path=/api/auth/**]
        - id: events
          uri: http://events-service:8082
          predicates: [Path=/api/events/**]
        - id: orders
          uri: http://orders-service:8083
          predicates: [Path=/api/orders/**]
        - id: tickets
          uri: http://tickets-service:8084
          predicates: [Path=/api/tickets/**]
management:
  endpoints:
    web:
      exposure:
        include: health,info
