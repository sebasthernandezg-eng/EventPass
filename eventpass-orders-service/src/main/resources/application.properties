spring.application.name=eventpass-orders-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventpass_orders}
spring.datasource.username=${DB_USER:eventpass}
spring.datasource.password=${DB_PASSWORD:eventpass_local_only}
spring.jpa.hibernate.ddl-auto=update
aws.region=${AWS_REGION:us-east-1}
sqs.endpoint=${SQS_ENDPOINT:http://localhost:4566}
sqs.queue-url=${SQS_QUEUE_URL:http://localhost:4566/000000000000/ordenes-pendientes}
